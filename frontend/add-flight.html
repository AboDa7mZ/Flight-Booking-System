<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Flight - Flight Booking</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-dark: #1557b0;
            --secondary-color: #34a853;
            --danger-color: #ea4335;
            --color-white: #ffffff;
            --color-gray-50: #f8f9fa;
            --color-gray-700: #3c4043;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --radius-lg: 12px;
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--color-gray-50);
        }

        .container {
            max-width: 900px;
            margin: 100px auto 50px;
            padding: 0 20px;
        }

        .add-flight-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-lg);
        }

        .add-flight-card h1 {
            color: var(--color-gray-700);
            margin: 0 0 var(--spacing-lg) 0;
            font-size: 2rem;
        }

        .form-section {
            margin-bottom: var(--spacing-xl);
        }

        .form-section h2 {
            color: var(--color-gray-700);
            font-size: 1.25rem;
            margin-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--color-gray-700);
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .route-section {
            background: #f8f9fa;
            padding: var(--spacing-lg);
            border-radius: 8px;
            margin-bottom: var(--spacing-md);
        }

        .route-stops {
            margin-top: var(--spacing-md);
        }

        .stop-item {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
            align-items: center;
            margin-bottom: var(--spacing-md);
            background: white;
            padding: var(--spacing-md);
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .stop-item input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
        
        .stop-item input[type="datetime-local"] {
            flex: 1;
            min-width: 200px;
        }
        
        .stop-item select {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
        }
        
        .stop-item select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .stop-number {
            background: var(--primary-color);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .remove-stop {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .remove-stop:hover {
            opacity: 0.8;
        }

        .add-stop-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s;
        }

        .add-stop-btn:hover {
            opacity: 0.9;
        }

        .submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background: var(--primary-dark);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .back-btn {
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            margin-bottom: var(--spacing-md);
            font-weight: 600;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: var(--spacing-md);
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <script src="js/navbar-loader.js"></script>
    <script>loadNavbar('components/company-navbar.html');</script>

    <div class="container">
        <a href="company-home.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

        <div class="add-flight-card">
            <h1><i class="fas fa-plane-departure"></i> Add New Flight</h1>

            <div id="alertBox" class="alert"></div>

            <form id="addFlightForm">
                <!-- Flight Basic Information -->
                <div class="form-section">
                    <h2>Flight Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="flightName">Flight Name *</label>
                            <input type="text" id="flightName" required placeholder="e.g., New York to London Express">
                        </div>
                        <div class="form-group">
                            <label for="flightCode">Flight Code *</label>
                            <input type="text" id="flightCode" required placeholder="e.g., SW101" maxlength="10">
                        </div>
                        <div class="form-group">
                            <label for="fees">Ticket Price ($) *</label>
                            <input type="number" id="fees" required min="0" step="0.01" placeholder="550.00">
                        </div>
                        <div class="form-group">
                            <label for="maxPassengers">Maximum Passengers *</label>
                            <input type="number" id="maxPassengers" required min="1" placeholder="150">
                        </div>
                    </div>
                </div>

                <!-- Flight Route -->
                <div class="form-section">
                    <h2>Flight Route</h2>
                    <div class="route-section">
                        <p style="color: #666; margin-bottom: 1rem;">
                            <i class="fas fa-info-circle"></i> Add cities in order. First city is departure, last city is arrival. Cities in between are stops.
                        </p>
                        <div id="routeStops" class="route-stops">
                            <!-- Route stops will be added here dynamically -->
                        </div>
                        <button type="button" class="add-stop-btn" onclick="addStop()">
                            <i class="fas fa-plus"></i> Add Stop
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fas fa-check"></i> Create Flight
                </button>
            </form>
        </div>
    </div>

    <script>
        // Cities list
        const cities = [
            'New York',
            'London',
            'Los Angeles',
            'Honolulu',
            'Tokyo',
            'Miami',
            'Paris',
            'Chicago',
            'Dubai',
            'Boston',
            'Berlin',
            'San Francisco',
            'Seattle',
            'Las Vegas',
            'Orlando',
            'Rome',
            'Barcelona',
            'Amsterdam',
            'Singapore',
            'Hong Kong',
            'Sydney',
            'Toronto',
            'Vancouver',
            'Mexico City',
            'Bangkok'
        ];
        
        // Check authentication
        const userId = localStorage.getItem('userId');
        const userType = localStorage.getItem('userType');

        if (!userId || userType !== 'company') {
            alert('Please login as a company');
            window.location.href = 'login.html';
        }

        let stopCount = 0;

        // Initialize with 2 stops (departure and arrival)
        window.addEventListener('DOMContentLoaded', function() {
            addStop(); // Departure
            addStop(); // Arrival
        });

        function addStop() {
            stopCount++;
            const stopItem = document.createElement('div');
            stopItem.className = 'stop-item';
            stopItem.id = `stop-${stopCount}`;
            
            const selectOptions = cities.map(city => `<option value="${city}">${city}</option>`).join('');
            
            // Determine label based on position
            let timeLabel = 'Time';
            if (stopCount === 1) {
                timeLabel = 'Departure Time';
            } else if (stopCount === 2 && document.querySelectorAll('.stop-item').length === 1) {
                timeLabel = 'Arrival Time';
            }
            
            stopItem.innerHTML = `
                <div class="stop-number">${stopCount}</div>
                <select required class="stop-city" data-sequence="${stopCount}" style="flex: 1; min-width: 150px;">
                    <option value="">Select city</option>
                    ${selectOptions}
                </select>
                <div style="flex: 1; min-width: 200px; display: flex; flex-direction: column;">
                    <label style="font-size: 0.85rem; color: #666; margin-bottom: 4px;">${timeLabel}</label>
                    <input type="datetime-local" required class="stop-time" data-sequence="${stopCount}" 
                           style="width: 100%;">
                </div>
                ${stopCount > 2 ? `<button type="button" class="remove-stop" onclick="removeStop(${stopCount})">
                    <i class="fas fa-times"></i>
                </button>` : ''}
            `;
            
            document.getElementById('routeStops').appendChild(stopItem);
        }

        function removeStop(id) {
            const stopElement = document.getElementById(`stop-${id}`);
            if (stopElement) {
                stopElement.remove();
                renumberStops();
            }
        }

        function renumberStops() {
            const stops = document.querySelectorAll('.stop-item');
            stops.forEach((stop, index) => {
                const number = index + 1;
                stop.querySelector('.stop-number').textContent = number;
                stop.querySelector('.stop-city').setAttribute('data-sequence', number);
            });
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        // Handle form submission
        document.getElementById('addFlightForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Flight...';

            // Collect flight data
            const flightData = {
                company_id: userId,
                flight_name: document.getElementById('flightName').value.trim(),
                flight_code: document.getElementById('flightCode').value.trim().toUpperCase(),
                fees: parseFloat(document.getElementById('fees').value),
                max_passengers: parseInt(document.getElementById('maxPassengers').value),
                route: []
            };

            // Collect route stops
            const stopItems = document.querySelectorAll('.stop-item');
            stopItems.forEach((stopItem, index) => {
                const cityInput = stopItem.querySelector('.stop-city');
                const timeInput = stopItem.querySelector('.stop-time');
                
                if (cityInput.value.trim() && timeInput.value) {
                    const datetime = timeInput.value;
                    // For first city, start and end are the same (departure)
                    // For last city, start and end are the same (arrival)
                    // For middle cities, start and end are the same (stopover time)
                    flightData.route.push({
                        city: cityInput.value.trim(),
                        sequence_order: parseInt(cityInput.getAttribute('data-sequence')),
                        start_datetime: datetime,
                        end_datetime: datetime
                    });
                }
            });

            // Validate route
            if (flightData.route.length < 2) {
                showAlert('Please add at least a departure and arrival city', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Create Flight';
                return;
            }

            try {
                const response = await fetch('http://localhost/Flight-Booking-Website/backend/api/add-flight.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(flightData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    const text = await response.text();
                    console.error('Received non-JSON response:', text);
                    throw new Error('Server returned non-JSON response');
                }

                const result = await response.json();

                if (result.success) {
                    showAlert('Flight created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'company-home.html';
                    }, 1500);
                } else {
                    showAlert(result.message || 'Failed to create flight', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> Create Flight';
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Network error. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Create Flight';
            }
        });
    </script>
</body>
</html>
