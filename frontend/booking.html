<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Booking - SkyVoyage</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        .booking-page {
            padding-top: 80px;
            min-height: 100vh;
            background: var(--color-gray-50);
        }
        
        .booking-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: var(--spacing-xl);
            padding: var(--spacing-xl) 0;
        }
        
        .booking-form-section {
            background: var(--color-white);
            padding: var(--spacing-xl);
            border-radius: var(--radius-xl);
        }
        
        .form-section {
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-xl);
            border-bottom: 1px solid var(--color-gray-200);
        }
        
        .form-section:last-child {
            border-bottom: none;
        }
        
        .form-section h2 {
            font-size: var(--text-xl);
            margin-bottom: var(--spacing-lg);
            color: var(--color-gray-900);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
        }
        
        .form-grid-full {
            grid-column: 1 / -1;
        }
        
        .form-group {
            margin-bottom: var(--spacing-md);
        }
        
        .form-group label {
            display: block;
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
            color: var(--color-gray-700);
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: var(--spacing-md);
            border: 1px solid var(--color-gray-300);
            border-radius: var(--radius-md);
            font-size: var(--text-base);
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .booking-summary {
            background: var(--color-white);
            padding: var(--spacing-xl);
            border-radius: var(--radius-xl);
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        
        .summary-section {
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--color-gray-200);
        }
        
        .summary-section:last-child {
            border-bottom: none;
        }
        
        .flight-route {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin: var(--spacing-md) 0;
        }
        
        .route-code {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--color-gray-900);
        }
        
        .price-breakdown {
            margin-top: var(--spacing-md);
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: var(--spacing-sm);
            color: var(--color-gray-600);
        }
        
        .price-total {
            display: flex;
            justify-content: space-between;
            font-size: var(--text-xl);
            font-weight: 700;
            color: var(--color-gray-900);
            padding-top: var(--spacing-md);
            border-top: 2px solid var(--color-gray-200);
        }
        
        @media (max-width: 768px) {
            .booking-container {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .booking-summary {
                position: static;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-plane-departure"></i>
                <span>SkyVoyage</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="search-results.html">Flights</a></li>
                <li><a href="#">My Bookings</a></li>
                <li><a href="#">Deals</a></li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-text btn-login">Login</a>
                <a href="register.html" class="btn btn-primary btn-signup">Sign Up</a>
            </div>
        </div>
    </nav>
    
    <div class="booking-page">
        <div class="container booking-container">
            <main class="booking-form-section">
                <h1>Complete Your Booking</h1>
                <p style="color: var(--color-gray-600); margin-bottom: var(--spacing-xl);">Fill in the passenger details to complete your booking</p>
                
                <form id="bookingForm">
                    <!-- Passenger Information -->
                    <div class="form-section">
                        <h2><i class="fas fa-user"></i> Passenger Information</h2>
                        <div id="passengersContainer"></div>
                    </div>
                    
                    <!-- Contact Information -->
                    <div class="form-section">
                        <h2><i class="fas fa-envelope"></i> Contact Information</h2>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="email">Email Address *</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number *</label>
                                <input type="tel" id="phone" name="phone" required>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Payment Information -->
                    <div class="form-section">
                        <h2><i class="fas fa-credit-card"></i> Payment Information</h2>
                        <div class="form-grid">
                            <div class="form-group form-grid-full">
                                <label for="cardNumber">Card Number *</label>
                                <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" required>
                            </div>
                            <div class="form-group">
                                <label for="cardName">Cardholder Name *</label>
                                <input type="text" id="cardName" name="cardName" required>
                            </div>
                            <div class="form-group">
                                <label for="expiryDate">Expiry Date *</label>
                                <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" required>
                            </div>
                            <div class="form-group">
                                <label for="cvv">CVV *</label>
                                <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: var(--spacing-lg);">
                        <i class="fas fa-lock"></i> Confirm Booking & Pay
                    </button>
                </form>
            </main>
            
            <aside class="booking-summary">
                <h2>Booking Summary</h2>
                
                <div class="summary-section">
                    <h3 style="font-size: var(--text-sm); color: var(--color-gray-600); margin-bottom: var(--spacing-sm);">Flight Details</h3>
                    <div id="flightDetails">
                        <p>Loading...</p>
                    </div>
                </div>
                
                <div class="summary-section">
                    <h3 style="font-size: var(--text-sm); color: var(--color-gray-600); margin-bottom: var(--spacing-sm);">Price Breakdown</h3>
                    <div class="price-breakdown" id="priceBreakdown">
                        <div class="price-row">
                            <span>Loading...</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script>
        let selectedFlight = null;
        let numPassengers = 1;
        
        function loadBookingData() {
            const flightData = sessionStorage.getItem('selectedFlight');
            
            if (!flightData) {
                alert('No flight selected. Redirecting to search page...');
                window.location.href = 'index.html';
                return;
            }
            
            selectedFlight = JSON.parse(flightData);
            console.log('Selected flight:', selectedFlight);
            
            // Get number of passengers from URL or default to 1
            const urlParams = new URLSearchParams(window.location.search);
            numPassengers = parseInt(urlParams.get('passengers')) || 1;
            
            displayFlightSummary();
            generatePassengerForms();
            displayPriceBreakdown();
        }
        
        function displayFlightSummary() {
            const formatTimeLocal = (dateStr) => {
                return new Date(dateStr).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            };
            
            const formatDateLocal = (dateStr) => {
                return new Date(dateStr).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            };
            
            const flightDetailsHTML = `
                <div style="margin-bottom: var(--spacing-md);">
                    <div style="display: flex; align-items: center; gap: var(--spacing-sm); margin-bottom: var(--spacing-sm);">
                        <div style="width: 40px; height: 40px; background: var(--color-gray-100); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--primary-color);">
                            ${selectedFlight.airline_code}
                        </div>
                        <div>
                            <div style="font-weight: 600;">${selectedFlight.airline_name}</div>
                            <div style="font-size: var(--text-sm); color: var(--color-gray-600);">${selectedFlight.flight_number}</div>
                        </div>
                    </div>
                </div>
                
                <div class="flight-route">
                    <span class="route-code">${selectedFlight.departure_code}</span>
                    <i class="fas fa-arrow-right" style="color: var(--primary-color);"></i>
                    <span class="route-code">${selectedFlight.arrival_code}</span>
                </div>
                
                <div style="margin-top: var(--spacing-md); font-size: var(--text-sm); color: var(--color-gray-600);">
                    <div style="margin-bottom: var(--spacing-xs);">
                        <strong>Departure:</strong> ${formatDateLocal(selectedFlight.departure_time)} at ${formatTimeLocal(selectedFlight.departure_time)}
                    </div>
                    <div>
                        <strong>Arrival:</strong> ${formatDateLocal(selectedFlight.arrival_time)} at ${formatTimeLocal(selectedFlight.arrival_time)}
                    </div>
                </div>
            `;
            
            document.getElementById('flightDetails').innerHTML = flightDetailsHTML;
        }
        
        function generatePassengerForms() {
            const container = document.getElementById('passengersContainer');
            let formsHTML = '';
            
            for (let i = 1; i <= numPassengers; i++) {
                formsHTML += `
                    <div style="margin-bottom: var(--spacing-lg);">
                        <h3 style="font-size: var(--text-lg); margin-bottom: var(--spacing-md); color: var(--primary-color);">Passenger ${i}</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="firstName${i}">First Name *</label>
                                <input type="text" id="firstName${i}" name="firstName${i}" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName${i}">Last Name *</label>
                                <input type="text" id="lastName${i}" name="lastName${i}" required>
                            </div>
                            <div class="form-group">
                                <label for="dateOfBirth${i}">Date of Birth *</label>
                                <input type="date" id="dateOfBirth${i}" name="dateOfBirth${i}" required>
                            </div>
                            <div class="form-group">
                                <label for="gender${i}">Gender *</label>
                                <select id="gender${i}" name="gender${i}" required>
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="passportNumber${i}">Passport Number *</label>
                                <input type="text" id="passportNumber${i}" name="passportNumber${i}" required>
                            </div>
                            <div class="form-group">
                                <label for="nationality${i}">Nationality *</label>
                                <input type="text" id="nationality${i}" name="nationality${i}" required>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = formsHTML;
        }
        
        function displayPriceBreakdown() {
            const basePrice = parseFloat(selectedFlight.price);
            const subtotal = basePrice * numPassengers;
            const taxes = subtotal * 0.15; // 15% tax
            const total = subtotal + taxes;
            
            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount);
            };
            
            const breakdownHTML = `
                <div class="price-row">
                    <span>Base Fare × ${numPassengers}</span>
                    <span>${formatCurrency(subtotal)}</span>
                </div>
                <div class="price-row">
                    <span>Taxes & Fees</span>
                    <span>${formatCurrency(taxes)}</span>
                </div>
                <div class="price-total">
                    <span>Total Amount</span>
                    <span>${formatCurrency(total)}</span>
                </div>
            `;
            
            document.getElementById('priceBreakdown').innerHTML = breakdownHTML;
        }
        
        // Handle form submission
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get user authentication
            const authToken = localStorage.getItem('authToken');
            const userId = localStorage.getItem('userId');
            
            if (!authToken || !userId) {
                alert('Please login to complete booking');
                window.location.href = 'login.html';
                return;
            }
            
            // Collect passenger data
            const passengers = [];
            for (let i = 1; i <= numPassengers; i++) {
                passengers.push({
                    first_name: document.getElementById(`firstName${i}`).value,
                    last_name: document.getElementById(`lastName${i}`).value,
                    date_of_birth: document.getElementById(`dateOfBirth${i}`).value,
                    gender: document.getElementById(`gender${i}`).value,
                    passport_number: document.getElementById(`passportNumber${i}`).value,
                    nationality: document.getElementById(`nationality${i}`).value
                });
            }
            
            const bookingData = {
                user_id: userId,
                flight_id: selectedFlight.flight_id,
                passengers: passengers,
                contact_email: document.getElementById('email').value,
                contact_phone: document.getElementById('phone').value,
                payment_info: {
                    card_number: document.getElementById('cardNumber').value,
                    card_name: document.getElementById('cardName').value,
                    expiry_date: document.getElementById('expiryDate').value,
                    cvv: document.getElementById('cvv').value
                }
            };
            
            console.log('Booking data:', bookingData);
            
            // Show loading
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            try {
                // TODO: Implement actual booking API call
                // For now, just simulate success
                setTimeout(() => {
                    alert('Booking successful! Your booking reference is: BK' + Math.random().toString(36).substr(2, 9).toUpperCase());
                    window.location.href = 'index.html';
                }, 2000);
            } catch (error) {
                console.error('Booking error:', error);
                alert('Booking failed. Please try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-lock"></i> Confirm Booking & Pay';
            }
        });
        
        // Load booking data on page load
        document.addEventListener('DOMContentLoaded', loadBookingData);
    </script>
</body>
</html>
