<nav class="navbar navbar-fixed">
    <div class="container nav-container">
        <a href="passenger-home.html" class="logo">
            <i class="fas fa-plane-departure"></i>
            <span>Flight Booking</span>
        </a>
        <ul class="nav-menu">
            <li><a href="passenger-home.html" id="nav-dashboard">Dashboard</a></li>
            <li><a href="search-flights.html" id="nav-search">Search Flights</a></li>
            <li><a href="messages.html" id="nav-messages">Messages</a></li>
            <li><a href="passenger-profile.html" id="nav-profile">Profile</a></li>
        </ul>
        <div class="nav-actions">
            <button class="btn btn-text" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>
</nav>

<script>
    // Highlight active nav item based on current page
    document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop();
        const navItems = {
            'passenger-home.html': 'nav-dashboard',
            'search-flights.html': 'nav-search',
            'search-results.html': 'nav-search',
            'flight-info.html': 'nav-search',
            'messages.html': 'nav-messages',
            'passenger-profile.html': 'nav-profile'
        };
        
        const activeNav = navItems[currentPage];
        if (activeNav) {
            document.getElementById(activeNav)?.classList.add('active');
        }
    });
    
    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>
