<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Messages - Flight Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary-color: #2196F3;
            --secondary-color: #4CAF50;
            --danger-color: #f44336;
            --dark-color: #1a1a2e;
            --light-color: #f5f5f5;
            --border-radius: 12px;
            --box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        body {
            background: var(--light-color);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .messages-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 1.5rem;
            height: calc(100vh - 4rem);
        }
        
        .sidebar {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 2px solid var(--light-color);
        }
        
        .sidebar-header h2 {
            margin: 0 0 1rem 0;
            color: var(--dark-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.875rem;
            transition: gap 0.3s ease;
        }
        
        .back-link:hover {
            gap: 0.75rem;
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .conversation-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--light-color);
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .conversation-item:hover {
            background: rgba(33, 150, 243, 0.05);
        }
        
        .conversation-item.active {
            background: rgba(33, 150, 243, 0.1);
            border-left: 4px solid var(--primary-color);
        }
        
        .conversation-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #9C27B0, #7B1FA2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .conversation-info {
            flex: 1;
            min-width: 0;
        }
        
        .conversation-info h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1rem;
            color: var(--dark-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conversation-info p {
            margin: 0;
            font-size: 0.875rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-container {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 1.5rem;
            border-bottom: 2px solid var(--light-color);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .chat-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #9C27B0, #7B1FA2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
        }
        
        .chat-info h2 {
            margin: 0 0 0.25rem 0;
            color: var(--dark-color);
            font-size: 1.25rem;
        }
        
        .chat-info p {
            margin: 0;
            color: #666;
            font-size: 0.875rem;
        }
        
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .message {
            max-width: 70%;
            padding: 1rem;
            border-radius: var(--border-radius);
            position: relative;
        }
        
        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary-color), #1976D2);
            color: white;
        }
        
        .message.received {
            align-self: flex-start;
            background: var(--light-color);
            color: var(--dark-color);
        }
        
        .message-content {
            margin: 0 0 0.5rem 0;
            word-wrap: break-word;
        }
        
        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
        }
        
        .message-input-area {
            padding: 1.5rem;
            border-top: 2px solid var(--light-color);
            display: flex;
            gap: 1rem;
        }
        
        .message-input-area input {
            flex: 1;
            padding: 1rem;
            border: 2px solid var(--light-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        .message-input-area input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .send-button {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--primary-color), #1976D2);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .send-button:hover {
            transform: translateY(-2px);
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .empty-state h3 {
            margin: 0 0 0.5rem 0;
        }
        
        @media (max-width: 768px) {
            .messages-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .sidebar {
                max-height: 300px;
            }
            
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="messages-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-comments"></i> Messages</h2>
                <a href="#" class="back-link" id="backLink">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <h3>No conversations yet</h3>
                    <p>Start messaging companies</p>
                </div>
            </div>
        </div>
        
        <div class="chat-container">
            <div class="chat-header" id="chatHeader" style="display: none;">
                <div class="chat-avatar" id="chatAvatar">C</div>
                <div class="chat-info">
                    <h2 id="chatCompanyName">Company Name</h2>
                    <p>Airline Company</p>
                </div>
            </div>
            
            <div class="messages-area" id="messagesArea">
                <div class="empty-state">
                    <i class="fas fa-comment-dots"></i>
                    <h3>Select a conversation</h3>
                    <p>Choose a company to start messaging</p>
                </div>
            </div>
            
            <div class="message-input-area" id="messageInputArea" style="display: none;">
                <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleEnter(event)">
                <button class="send-button" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </div>
    </div>
    
    <script>
        const userId = localStorage.getItem('userId');
        const userType = localStorage.getItem('userType');
        const userName = localStorage.getItem('userName');
        
        if (!userId) {
            alert('Please login first');
            window.location.href = 'login.html';
        }
        
        // Set the back link based on user type
        const backLink = document.getElementById('backLink');
        if (userType === 'company') {
            backLink.href = 'company-home.html';
        } else {
            backLink.href = 'passenger-home.html';
        }
        
        let currentCompanyId = null;
        let currentCompanyName = null;
        
        // Check if coming from flight-info with company parameter
        const urlParams = new URLSearchParams(window.location.search);
        const companyIdParam = urlParams.get('company_id');
        const companyNameParam = urlParams.get('company_name');
        
        if (companyIdParam && companyNameParam) {
            currentCompanyId = companyIdParam;
            currentCompanyName = decodeURIComponent(companyNameParam);
            openChat(currentCompanyId, currentCompanyName);
        }
        
        // Load conversations
        async function loadConversations() {
            try {
                const response = await fetch(`http://localhost/Flight-Booking-Website/backend/api/messages.php?user_id=${userId}`);
                const data = await response.json();
                
                if (data.success && data.conversations && data.conversations.length > 0) {
                    displayConversations(data.conversations);
                } else {
                    // No conversations yet, show available companies to message
                    if (userType === 'passenger') {
                        loadAvailableCompanies();
                    }
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
                if (userType === 'passenger') {
                    loadAvailableCompanies();
                }
            }
        }
        
        // Load available companies for passengers to start conversations
        async function loadAvailableCompanies() {
            try {
                const response = await fetch(`http://localhost/Flight-Booking-Website/backend/api/get-companies.php`);
                const data = await response.json();
                
                if (data.success && data.companies && data.companies.length > 0) {
                    displayAvailableCompanies(data.companies);
                }
            } catch (error) {
                console.error('Error loading companies:', error);
            }
        }
        
        function displayAvailableCompanies(companies) {
            const list = document.getElementById('conversationsList');
            list.innerHTML = `
                <div style="padding: 1rem 1.5rem; color: #666; font-size: 0.875rem; border-bottom: 1px solid var(--light-color);">
                    <i class="fas fa-info-circle"></i> Select a company to start messaging
                </div>
            ` + companies.map(company => `
                <div class="conversation-item ${company.user_id == currentCompanyId ? 'active' : ''}" 
                     onclick="openChat('${company.user_id}', '${company.name}')">
                    <div class="conversation-avatar">${company.name.charAt(0).toUpperCase()}</div>
                    <div class="conversation-info">
                        <h3>${company.name}</h3>
                        <p style="color: #999; font-size: 0.875rem;">Airline Company</p>
                    </div>
                </div>
            `).join('');
        }
        
        function displayConversations(conversations) {
            const list = document.getElementById('conversationsList');
            list.innerHTML = conversations.map(conv => {
                // Handle both passenger and company views
                const otherId = conv.company_id || conv.passenger_id;
                const otherName = conv.company_name || conv.passenger_name;
                const isActive = otherId == currentCompanyId;
                
                return `
                    <div class="conversation-item ${isActive ? 'active' : ''}" 
                         onclick="openChat('${otherId}', '${otherName}')">
                        <div class="conversation-avatar">${otherName.charAt(0).toUpperCase()}</div>
                        <div class="conversation-info">
                            <h3>${otherName}</h3>
                            <p>${conv.last_message || 'No messages yet'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function openChat(companyId, companyName) {
            currentCompanyId = companyId;
            currentCompanyName = companyName;
            
            // Update UI
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('messageInputArea').style.display = 'flex';
            document.getElementById('chatCompanyName').textContent = companyName;
            document.getElementById('chatAvatar').textContent = companyName.charAt(0).toUpperCase();
            
            // Update active conversation
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // Load messages
            loadMessages(companyId);
        }
        
        async function loadMessages(companyId) {
            try {
                const response = await fetch(`http://localhost/Flight-Booking-Website/backend/api/messages.php?user_id=${userId}&company_id=${companyId}`);
                const data = await response.json();
                
                if (data.success && data.messages) {
                    displayMessages(data.messages);
                } else {
                    document.getElementById('messagesArea').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-comment"></i>
                            <h3>No messages yet</h3>
                            <p>Start a conversation with ${currentCompanyName}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }
        
        function displayMessages(messages) {
            const area = document.getElementById('messagesArea');
            area.innerHTML = messages.map(msg => {
                const isSent = msg.sender_id == userId;
                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        <p class="message-content">${msg.message}</p>
                        <div class="message-time">${new Date(msg.created_at).toLocaleString()}</div>
                    </div>
                `;
            }).join('');
            
            // Scroll to bottom
            area.scrollTop = area.scrollHeight;
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const messageText = input.value.trim();
            
            if (!messageText) {
                alert('Please enter a message');
                return;
            }
            
            if (!currentCompanyId) {
                alert('Please select a company to message');
                return;
            }
            
            try {
                const response = await fetch('http://localhost/Flight-Booking-Website/backend/api/messages.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sender_id: userId,
                        receiver_id: currentCompanyId,
                        message_text: messageText
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    input.value = '';
                    loadMessages(currentCompanyId);
                } else {
                    alert('Failed to send message: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Error sending message');
            }
        }
        
        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // Load initial data
        loadConversations();
    </script>
</body>
</html>
