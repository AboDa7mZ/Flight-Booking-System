<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>My Dashboard - Flight Booking</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a73e8;
            --primary-dark: #1557b0;
            --secondary-color: #34a853;
            --accent-color: #fbbc04;
            --danger-color: #ea4335;
            --color-white: #ffffff;
            --color-gray-50: #f8f9fa;
            --color-gray-100: #f1f3f4;
            --color-gray-200: #e8eaed;
            --color-gray-300: #dadce0;
            --color-gray-600: #5f6368;
            --color-gray-700: #3c4043;
            --color-gray-900: #202124;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            --spacing-3xl: 4rem;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-2xl: 24px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px rgba(0, 0, 0, 0.1);
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-lg: 1.125rem;
            --text-xl: 1.25rem;
            --text-2xl: 1.5rem;
            --text-3xl: 1.875rem;
            --text-4xl: 2.25rem;
        }
        
        .dashboard {
            padding-top: 80px;
            min-height: 100vh;
            background: var(--color-gray-50);
        }
        
        .dashboard-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--color-white);
            padding: var(--spacing-3xl) 0 var(--spacing-2xl) 0;
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }
        
        .user-avatar {
            width: 100px;
            height: 100px;
            background: var(--color-white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-4xl);
            color: var(--primary-color);
            font-weight: 800;
            box-shadow: var(--shadow-xl);
        }
        
        .user-details h1 {
            font-size: var(--text-3xl);
            margin: 0 0 var(--spacing-sm) 0;
        }
        
        .user-details p {
            opacity: 0.9;
            margin: var(--spacing-sm) 0;
        }
        
        .balance-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-lg);
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-md);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .balance-card i {
            font-size: var(--text-2xl);
            color: var(--accent-color);
        }
        
        .balance-info span {
            display: block;
            font-size: var(--text-sm);
            opacity: 0.9;
        }
        
        .balance-info strong {
            font-size: var(--text-xl);
            display: block;
            font-weight: 700;
        }
        
        .quick-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }
        
        .btn-white {
            background: var(--color-white);
            color: var(--primary-color);
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        
        .btn-white:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-outline {
            background: transparent;
            color: var(--color-white);
            border: 2px solid var(--color-white);
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            transition: all 0.2s;
        }
        
        .btn-outline:hover {
            background: var(--color-white);
            color: var(--primary-color);
        }
        
        .tabs-nav {
            display: flex;
            gap: var(--spacing-md);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .tab-button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            padding: var(--spacing-md) var(--spacing-xl);
            font-size: var(--text-base);
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            position: relative;
            bottom: -2px;
        }
        
        .tab-button:hover {
            color: var(--color-white);
        }
        
        .tab-button.active {
            color: var(--color-white);
            border-bottom-color: var(--color-white);
        }
        
        .dashboard-content {
            padding: var(--spacing-2xl) 0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-2xl);
        }
        
        .stat-card {
            background: var(--color-white);
            padding: var(--spacing-xl);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-2xl);
            margin-bottom: var(--spacing-md);
        }
        
        .stat-icon.primary {
            background: rgba(26, 115, 232, 0.1);
            color: var(--primary-color);
        }
        
        .stat-icon.success {
            background: rgba(52, 168, 83, 0.1);
            color: var(--secondary-color);
        }
        
        .stat-icon.warning {
            background: rgba(251, 188, 4, 0.1);
            color: var(--accent-color);
        }
        
        .stat-value {
            font-size: var(--text-3xl);
            font-weight: 800;
            color: var(--color-gray-900);
            margin-bottom: var(--spacing-sm);
        }
        
        .stat-label {
            color: var(--color-gray-600);
            font-size: var(--text-sm);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .section-card {
            background: var(--color-white);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            box-shadow: var(--shadow-md);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .section-header h2 {
            font-size: var(--text-2xl);
            color: var(--color-gray-900);
            margin: 0;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .flights-grid {
            display: grid;
            gap: var(--spacing-lg);
        }
        
        .flight-card {
            background: var(--color-gray-50);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            border: 2px solid var(--color-gray-200);
            transition: all 0.3s;
        }
        
        .flight-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }
        
        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-lg);
        }
        
        .flight-title {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .flight-icon {
            width: 50px;
            height: 50px;
            background: var(--primary-color);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-white);
            font-size: var(--text-xl);
        }
        
        .flight-info h3 {
            margin: 0 0 var(--spacing-sm) 0;
            color: var(--color-gray-900);
            font-size: var(--text-lg);
        }
        
        .flight-code {
            color: var(--color-gray-600);
            font-size: var(--text-sm);
        }
        
        .status-badge {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            font-weight: 600;
        }
        
        .status-registered {
            background: rgba(52, 168, 83, 0.1);
            color: var(--secondary-color);
        }
        
        .status-pending {
            background: rgba(251, 188, 4, 0.1);
            color: var(--accent-color);
        }
        
        .status-cancelled {
            background: rgba(234, 67, 53, 0.1);
            color: var(--danger-color);
        }
        
        .flight-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            color: var(--color-gray-700);
            font-size: var(--text-sm);
        }
        
        .detail-item i {
            color: var(--primary-color);
        }
        
        .flight-actions {
            display: flex;
            gap: var(--spacing-sm);
        }
        
        .btn-sm {
            padding: var(--spacing-sm) var(--spacing-lg);
            font-size: var(--text-sm);
        }
        
        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl);
            color: var(--color-gray-600);
        }
        
        .empty-state i {
            font-size: 4rem;
            color: var(--color-gray-300);
            margin-bottom: var(--spacing-lg);
        }
        
        .empty-state h3 {
            color: var(--color-gray-900);
            margin-bottom: var(--spacing-sm);
        }
        
        @media (max-width: 768px) {
            .user-profile {
                flex-direction: column;
                text-align: center;
            }
            
            .quick-actions {
                flex-direction: column;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .flight-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="passenger-home.html" class="logo">
                <i class="fas fa-plane-departure"></i>
                <span>Flight Booking</span>
            </a>
            <ul class="nav-menu">
                <li><a href="passenger-home.html" class="active">Dashboard</a></li>
                <li><a href="search-flights.html">Search Flights</a></li>
                <li><a href="passenger-profile.html">Profile</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn btn-text" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </nav>
    
    <div class="dashboard">
        <div class="dashboard-header">
            <div class="container">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">P</div>
                    <div class="user-details">
                        <h1 id="userName">Passenger Name</h1>
                        <p><i class="fas fa-envelope"></i> <span id="userEmail">email@example.com</span></p>
                        <div class="balance-card">
                            <i class="fas fa-wallet"></i>
                            <div class="balance-info">
                                <span>Account Balance</span>
                                <strong>$<span id="accountBalance">0.00</span></strong>
                            </div>
                        </div>
                        <div class="quick-actions">
                            <a href="search-flights.html" class="btn-white">
                                <i class="fas fa-search"></i> Search Flights
                            </a>
                            <a href="passenger-profile.html" class="btn-outline">
                                <i class="fas fa-user-edit"></i> Edit Profile
                            </a>
                        </div>
                    </div>
                </div>
                
                <div class="tabs-nav">
                    <button class="tab-button active" onclick="switchTab('upcoming')">
                        <i class="fas fa-plane-departure"></i> Upcoming Flights
                    </button>
                    <button class="tab-button" onclick="switchTab('completed')">
                        <i class="fas fa-check-circle"></i> Completed
                    </button>
                    <button class="tab-button" onclick="switchTab('cancelled')">
                        <i class="fas fa-times-circle"></i> Cancelled
                    </button>
                </div>
            </div>
        </div>
        
        <div class="dashboard-content">
            <div class="container">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon primary">
                            <i class="fas fa-ticket-alt"></i>
                        </div>
                        <div class="stat-value" id="totalBookings">0</div>
                        <div class="stat-label">Total Bookings</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon success">
                            <i class="fas fa-plane"></i>
                        </div>
                        <div class="stat-value" id="upcomingFlights">0</div>
                        <div class="stat-label">Upcoming Flights</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-icon warning">
                            <i class="fas fa-dollar-sign"></i>
                        </div>
                        <div class="stat-value" id="totalSpent">$0</div>
                        <div class="stat-label">Total Spent</div>
                    </div>
                </div>
                
                <!-- Upcoming Flights Tab -->
                <div id="upcomingTab" class="tab-content active">
                    <div class="section-card">
                        <div class="section-header">
                            <h2>
                                <i class="fas fa-plane-departure"></i>
                                Upcoming Flights
                            </h2>
                        </div>
                        <div class="flights-grid" id="upcomingFlights"></div>
                    </div>
                </div>
                
                <!-- Completed Flights Tab -->
                <div id="completedTab" class="tab-content">
                    <div class="section-card">
                        <div class="section-header">
                            <h2>
                                <i class="fas fa-check-circle"></i>
                                Completed Flights
                            </h2>
                        </div>
                        <div class="flights-grid" id="completedFlights"></div>
                    </div>
                </div>
                
                <!-- Cancelled Flights Tab -->
                <div id="cancelledTab" class="tab-content">
                    <div class="section-card">
                        <div class="section-header">
                            <h2>
                                <i class="fas fa-times-circle"></i>
                                Cancelled Flights
                            </h2>
                        </div>
                        <div class="flights-grid" id="cancelledFlights"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Check authentication
        const userId = localStorage.getItem('userId');
        const userType = localStorage.getItem('userType');
        const userName = localStorage.getItem('userName');
        const userEmail = localStorage.getItem('userEmail');
        const accountBalance = localStorage.getItem('accountBalance');
        
        if (!userId || userType !== 'passenger') {
            alert('Please login as a passenger');
            window.location.href = 'login.html';
        }
        
        let allBookings = [];
        
        // Initialize page
        window.addEventListener('DOMContentLoaded', function() {
            displayUserInfo();
            loadUserProfile();
            loadBookings();
        });
        
        // Display user info
        function displayUserInfo() {
            document.getElementById('userName').textContent = userName || 'Passenger';
            document.getElementById('userEmail').textContent = userEmail || 'email@example.com';
            document.getElementById('accountBalance').textContent = parseFloat(accountBalance || 0).toFixed(2);
            
            const avatar = document.getElementById('userAvatar');
            if (userName) {
                avatar.textContent = userName.charAt(0).toUpperCase();
            }
        }
        
        // Load fresh user profile from server
        async function loadUserProfile() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`backend/api/get-profile.php?user_id=${userId}&_=${timestamp}`, {
                    cache: 'no-cache',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    // Update localStorage with fresh data
                    localStorage.setItem('accountBalance', data.user.account_balance);
                    // Update displayed balance
                    document.getElementById('accountBalance').textContent = parseFloat(data.user.account_balance).toFixed(2);
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }
        
        // Logout function
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
        
        // Switch tabs
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + 'Tab').classList.add('active');
        }
        
        // Load passenger bookings
        async function loadBookings() {
            showLoading();
            
            try {
                const response = await fetch(`http://localhost/Flight-Booking-Website/backend/api/passenger-bookings.php?passenger_id=${userId}`);
                const data = await response.json();
                
                console.log('Bookings data:', data);
                
                if (data.success && data.bookings && data.bookings.length > 0) {
                    allBookings = data.bookings;
                    displayBookings(allBookings);
                    updateStats(allBookings);
                } else {
                    displayEmptyStates();
                }
            } catch (error) {
                console.error('Error loading bookings:', error);
                displayError();
            }
        }
        
        function showLoading() {
            const loadingHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Loading your flights...</h3>
                </div>
            `;
            document.getElementById('upcomingFlights').innerHTML = loadingHTML;
            document.getElementById('completedFlights').innerHTML = loadingHTML;
            document.getElementById('cancelledFlights').innerHTML = loadingHTML;
        }
        
        function displayBookings(bookings) {
            const upcoming = bookings.filter(b => b.status !== 'cancelled' && !b.is_completed);
            const completed = bookings.filter(b => b.is_completed);
            const cancelled = bookings.filter(b => b.status === 'cancelled');
            
            displayUpcomingFlights(upcoming);
            displayCompletedFlights(completed);
            displayCancelledFlights(cancelled);
        }
        
        function displayUpcomingFlights(flights) {
            const container = document.getElementById('upcomingFlights');
            
            if (flights.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-plane-slash"></i>
                        <h3>No Upcoming Flights</h3>
                        <p>You don't have any upcoming flights booked.</p>
                        <a href="search-flights.html" class="btn btn-primary" style="margin-top: 1rem; display: inline-block;">
                            <i class="fas fa-search"></i> Search Flights
                        </a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = flights.map(flight => `
                <div class="flight-card">
                    <div class="flight-header">
                        <div class="flight-title">
                            <div class="flight-icon">
                                <i class="fas fa-plane"></i>
                            </div>
                            <div class="flight-info">
                                <h3>${flight.flight_name}</h3>
                                <span class="flight-code">${flight.flight_code || 'N/A'}</span>
                            </div>
                        </div>
                        <span class="status-badge status-${flight.status}">
                            ${flight.status.charAt(0).toUpperCase() + flight.status.slice(1)}
                        </span>
                    </div>
                    
                    <div class="flight-details">
                        <div class="detail-item">
                            <i class="fas fa-route"></i>
                            <span>${flight.route || 'Route not available'}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-calendar"></i>
                            <span>${new Date(flight.booking_date).toLocaleDateString()}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-money-bill-wave"></i>
                            <strong>$${parseFloat(flight.amount_paid || 0).toFixed(2)}</strong>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-credit-card"></i>
                            <span>${flight.payment_type || 'N/A'}</span>
                        </div>
                    </div>
                    
                    <div class="flight-actions">
                        <button class="btn btn-primary btn-sm" onclick="viewBookingDetails(${flight.booking_id})">
                            <i class="fas fa-eye"></i> View Details
                        </button>
                        ${flight.status === 'pending' ? `
                            <button class="btn btn-secondary btn-sm" onclick="cancelBooking(${flight.booking_id})">
                                <i class="fas fa-times"></i> Cancel
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function displayCompletedFlights(flights) {
            const container = document.getElementById('completedFlights');
            
            if (flights.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <h3>No Completed Flights</h3>
                        <p>You haven't completed any flights yet.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = flights.map(flight => `
                <div class="flight-card">
                    <div class="flight-header">
                        <div class="flight-title">
                            <div class="flight-icon" style="background: var(--secondary-color);">
                                <i class="fas fa-check"></i>
                            </div>
                            <div class="flight-info">
                                <h3>${flight.flight_name}</h3>
                                <span class="flight-code">${flight.flight_code || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flight-details">
                        <div class="detail-item">
                            <i class="fas fa-route"></i>
                            <span>${flight.route || 'Route not available'}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-calendar-check"></i>
                            <span>Completed: ${new Date(flight.booking_date).toLocaleDateString()}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-money-bill-wave"></i>
                            <strong>$${parseFloat(flight.amount_paid || 0).toFixed(2)}</strong>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function displayCancelledFlights(flights) {
            const container = document.getElementById('cancelledFlights');
            
            if (flights.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-info-circle"></i>
                        <h3>No Cancelled Flights</h3>
                        <p>You haven't cancelled any flights.</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = flights.map(flight => `
                <div class="flight-card">
                    <div class="flight-header">
                        <div class="flight-title">
                            <div class="flight-icon" style="background: var(--danger-color);">
                                <i class="fas fa-times"></i>
                            </div>
                            <div class="flight-info">
                                <h3>${flight.flight_name}</h3>
                                <span class="flight-code">${flight.flight_code || 'N/A'}</span>
                            </div>
                        </div>
                        <span class="status-badge status-cancelled">Cancelled</span>
                    </div>
                    
                    <div class="flight-details">
                        <div class="detail-item">
                            <i class="fas fa-route"></i>
                            <span>${flight.route || 'Route not available'}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-calendar-times"></i>
                            <span>Cancelled: ${new Date(flight.booking_date).toLocaleDateString()}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function displayEmptyStates() {
            const emptyHTML = `
                <div class="empty-state">
                    <i class="fas fa-plane-slash"></i>
                    <h3>No Bookings Yet</h3>
                    <p>Start your journey by searching for flights.</p>
                    <a href="search-flights.html" class="btn btn-primary" style="margin-top: 1rem; display: inline-block;">
                        <i class="fas fa-search"></i> Search Flights
                    </a>
                </div>
            `;
            document.getElementById('upcomingFlights').innerHTML = emptyHTML;
            document.getElementById('completedFlights').innerHTML = `<div class="empty-state"><i class="fas fa-check-circle"></i><h3>No Completed Flights</h3></div>`;
            document.getElementById('cancelledFlights').innerHTML = `<div class="empty-state"><i class="fas fa-info-circle"></i><h3>No Cancelled Flights</h3></div>`;
        }
        
        function displayError() {
            const errorHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color: var(--danger-color);"></i>
                    <h3 style="color: var(--danger-color);">Error Loading Flights</h3>
                    <p>Please refresh the page to try again.</p>
                    <button onclick="loadBookings()" class="btn btn-primary" style="margin-top: 1rem;">
                        <i class="fas fa-redo"></i> Retry
                    </button>
                </div>
            `;
            document.getElementById('upcomingFlights').innerHTML = errorHTML;
        }
        
        function updateStats(bookings) {
            const total = bookings.length;
            const upcoming = bookings.filter(b => b.status !== 'cancelled' && !b.is_completed).length;
            const totalSpent = bookings.reduce((sum, b) => sum + parseFloat(b.amount_paid || 0), 0);
            
            document.getElementById('totalBookings').textContent = total;
            document.getElementById('upcomingFlights').textContent = upcoming;
            document.getElementById('totalSpent').textContent = '$' + totalSpent.toFixed(2);
        }
        
        function viewBookingDetails(bookingId) {
            alert('Viewing booking details for ID: ' + bookingId);
        }
        
        function cancelBooking(bookingId) {
            if (confirm('Are you sure you want to cancel this booking?')) {
                alert('Cancellation feature coming soon! Booking ID: ' + bookingId);
            }
        }
    </script>
</body>
</html>
