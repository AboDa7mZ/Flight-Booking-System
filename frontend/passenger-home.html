<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Dashboard - SkyVoyage</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .dashboard {
            padding-top: 80px;
            min-height: 100vh;
            background: var(--color-gray-50);
        }
        .header-section {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--color-white);
            padding: var(--spacing-3xl) 0;
        }
        .user-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-xl);
        }
        .user-avatar {
            width: 100px;
            height: 100px;
            background: var(--color-white);
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-4xl);
            font-weight: 700;
        }
        .user-info h1 {
            font-size: var(--text-3xl);
            margin-bottom: var(--spacing-sm);
        }
        .balance-display {
            font-size: var(--text-xl);
            opacity: 0.9;
        }
        .tabs {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-2xl);
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }
        .tab {
            padding: var(--spacing-md) var(--spacing-xl);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: var(--transition-base);
        }
        .tab.active {
            border-bottom-color: var(--color-white);
        }
        .main-content {
            padding: var(--spacing-xl) 0;
        }
        .flights-grid {
            display: grid;
            gap: var(--spacing-lg);
            margin-top: var(--spacing-xl);
        }
        .flight-card {
            background: var(--color-white);
            padding: var(--spacing-xl);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
        }
        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }
        .search-section {
            background: var(--color-white);
            padding: var(--spacing-2xl);
            border-radius: var(--radius-xl);
            margin-top: var(--spacing-xl);
        }
        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: var(--spacing-md);
            align-items: end;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: var(--spacing-sm);
            font-weight: 600;
        }
        .form-group input, .form-group select {
            padding: var(--spacing-md);
            border: 2px solid var(--color-gray-300);
            border-radius: var(--radius-md);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="passenger-home.html" class="logo">
                <i class="fas fa-plane-departure"></i>
                <span>SkyVoyage</span>
            </a>
            <ul class="nav-menu">
                <li><a href="passenger-home.html" class="active">Home</a></li>
                <li><a href="search-flights.html">Search Flights</a></li>
                <li><a href="passenger-profile.html">Profile</a></li>
            </ul>
            <div class="nav-actions">
                <button class="btn btn-text" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>
    
    <div class="dashboard">
        <div class="header-section">
            <div class="container">
                <div class="user-header">
                    <div class="user-avatar" id="userAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-info">
                        <h1 id="userName">Passenger Name</h1>
                        <p id="userEmail">email@example.com</p>
                        <div class="balance-display">
                            <i class="fas fa-wallet"></i>
                            Account Balance: $<span id="accountBalance">0.00</span>
                        </div>
                    </div>
                </div>
                
                <div class="tabs">
                    <div class="tab active" onclick="showTab('current')">Current Flights</div>
                    <div class="tab" onclick="showTab('completed')">Completed Flights</div>
                    <div class="tab" onclick="showTab('search')">Search Flights</div>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="container">
                <div id="currentTab" class="tab-content">
                    <h2>Current Flights</h2>
                    <div class="flights-grid" id="currentFlights">
                        <p style="text-align: center; padding: var(--spacing-2xl);">
                            <i class="fas fa-spinner fa-spin fa-2x"></i><br>
                            Loading flights...
                        </p>
                    </div>
                </div>
                
                <div id="completedTab" class="tab-content" style="display: none;">
                    <h2>Completed Flights</h2>
                    <div class="flights-grid" id="completedFlights">
                        <p>No completed flights yet.</p>
                    </div>
                </div>
                
                <div id="searchTab" class="tab-content" style="display: none;">
                    <h2>Search for Flights</h2>
                    <div class="search-section">
                        <form class="search-form" onsubmit="searchFlights(event)">
                            <div class="form-group">
                                <label>From</label>
                                <input type="text" id="fromCity" placeholder="Departure city" required>
                            </div>
                            <div class="form-group">
                                <label>To</label>
                                <input type="text" id="toCity" placeholder="Arrival city" required>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-search"></i> Search
                            </button>
                        </form>
                        <div id="searchResults" style="margin-top: var(--spacing-xl);"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const userId = localStorage.getItem('userId');
        const userType = localStorage.getItem('userType');
        const userName = localStorage.getItem('userName');
        const userEmail = localStorage.getItem('userEmail');
        const accountBalance = localStorage.getItem('accountBalance');
        
        if (!userId || userType !== 'passenger') {
            alert('Please login as a passenger');
            window.location.href = 'login.html';
        }
        
        document.getElementById('userName').textContent = userName;
        document.getElementById('userEmail').textContent = userEmail;
        document.getElementById('accountBalance').textContent = parseFloat(accountBalance).toFixed(2);
        document.getElementById('userAvatar').textContent = userName.charAt(0).toUpperCase();
        
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
        
        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').style.display = 'block';
        }
        
        async function loadBookings() {
            try {
                const response = await fetch(`http://localhost/Flight-Booking-Website/backend/api/passenger-bookings.php?passenger_id=${userId}`);
                const data = await response.json();
                
                if (data.success && data.bookings) {
                    displayBookings(data.bookings);
                } else {
                    document.getElementById('currentFlights').innerHTML = `
                        <p style="text-align: center;">No current flights. <a href="#" onclick="showTab('search'); return false;">Search for flights</a></p>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('currentFlights').innerHTML = '<p style="color: var(--danger-color);">Error loading bookings</p>';
            }
        }
        
        function displayBookings(bookings) {
            const currentContainer = document.getElementById('currentFlights');
            const completedContainer = document.getElementById('completedFlights');
            
            const current = bookings.filter(b => b.status !== 'cancelled' && !b.is_completed);
            const completed = bookings.filter(b => b.is_completed);
            
            if (current.length === 0) {
                currentContainer.innerHTML = '<p style="text-align: center;">No current flights</p>';
            } else {
                currentContainer.innerHTML = current.map(booking => `
                    <div class="flight-card">
                        <div class="flight-header">
                            <h3>${booking.flight_name}</h3>
                            <span class="status-badge ${booking.status === 'registered' ? 'status-active' : 'status-pending'}">
                                ${booking.status}
                            </span>
                        </div>
                        <p><strong>Route:</strong> ${booking.route}</p>
                        <p><strong>Booking Date:</strong> ${new Date(booking.booking_date).toLocaleDateString()}</p>
                        <p><strong>Amount Paid:</strong> $${parseFloat(booking.amount_paid).toFixed(2)}</p>
                        <button class="btn btn-primary" onclick="viewBooking(${booking.booking_id})">View Details</button>
                    </div>
                `).join('');
            }
            
            if (completed.length === 0) {
                completedContainer.innerHTML = '<p>No completed flights yet</p>';
            } else {
                completedContainer.innerHTML = completed.map(booking => `
                    <div class="flight-card">
                        <div class="flight-header">
                            <h3>${booking.flight_name}</h3>
                        </div>
                        <p><strong>Route:</strong> ${booking.route}</p>
                        <p><strong>Completed:</strong> ${new Date(booking.booking_date).toLocaleDateString()}</p>
                    </div>
                `).join('');
            }
        }
        
        async function searchFlights(event) {
            event.preventDefault();
            const from = document.getElementById('fromCity').value;
            const to = document.getElementById('toCity').value;
            const resultsDiv = document.getElementById('searchResults');
            
            resultsDiv.innerHTML = '<p><i class="fas fa-spinner fa-spin"></i> Searching...</p>';
            
            try {
                const response = await fetch(`http://localhost/Flight-Booking-Website/backend/api/search-flights.php?from=${from}&to=${to}`);
                const data = await response.json();
                
                if (data.success && data.flights && data.flights.length > 0) {
                    resultsDiv.innerHTML = data.flights.map(flight => `
                        <div class="flight-card">
                            <h3>${flight.flight_name} (${flight.flight_code})</h3>
                            <p><strong>Company:</strong> ${flight.company_name}</p>
                            <p><strong>Route:</strong> ${flight.route}</p>
                            <p><strong>Price:</strong> $${parseFloat(flight.fees).toFixed(2)}</p>
                            <p><strong>Available Seats:</strong> ${flight.max_passengers - flight.registered_passengers - flight.pending_passengers}</p>
                            <button class="btn btn-primary" onclick="viewFlightInfo(${flight.flight_id})">View Details & Book</button>
                        </div>
                    `).join('');
                } else {
                    resultsDiv.innerHTML = '<p>No flights found for this route</p>';
                }
            } catch (error) {
                resultsDiv.innerHTML = '<p style="color: var(--danger-color);">Error searching flights</p>';
            }
        }
        
        function viewFlightInfo(flightId) {
            window.location.href = `flight-info.html?id=${flightId}`;
        }
        
        function viewBooking(bookingId) {
            alert('Booking details - ID: ' + bookingId);
        }
        
        loadBookings();
    </script>
</body>
</html>
