        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: var(--spacing-xl);
        }
        
        .auth-container {
            background: var(--color-white);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            max-width: 450px;
            width: 100%;
            padding: var(--spacing-3xl);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }
        
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            font-size: var(--text-2xl);
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: var(--spacing-lg);
        }
        
        .auth-header h1 {
            font-family: var(--font-display);
            font-size: var(--text-3xl);
            color: var(--color-gray-900);
            margin-bottom: var(--spacing-sm);
        }

            color: var(--color-gray-600);
        }
        
        .auth-form .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .auth-form label {
            display: block;
            font-weight: 600;
            color: var(--color-gray-700);
            margin-bottom: var(--spacing-sm);
        }
        
        .auth-form input {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--color-gray-300);
            border-radius: var(--radius-md);
            font-size: var(--text-base);
            transition: var(--transition-base);

        .auth-form input:focus {

            border-color: var(--primary-color);

        .auth-submit {

            color: var(--color-white);
            border: none;
            border-radius: var(--radius-md);
            font-size: var(--text-lg);
            font-weight: 600;

        }
        
        .auth-submit:hover {

            transform: translateY(-2px);

        }
        
        .auth-divider {

            gap: var(--spacing-md);
            margin: var(--spacing-xl) 0;
            color: var(--color-gray-500);
        }
        
        .auth-divider::before,

            flex: 1;
            height: 1px;
            background: var(--color-gray-300);
        }
        
        .social-login {

            color: var(--color-gray-700);
            font-weight: 600;

        .social-btn:hover {

        }
        
        .auth-footer {

            margin-top: var(--spacing-xl);
            color: var(--color-gray-600);

        .auth-footer a {
            color: var(--primary-color);

        }

        }

            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);

            margin-bottom: var(--spacing-lg);

    <script>
        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        // Auto-select account type from URL parameter
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            if (type && (type === 'passenger' || type === 'company')) {
                document.getElementById('userType').value = type;
            }
        });
        
        // Phone number validation function
        function validatePhoneNumber(phoneNumber) {
            const phoneError = document.getElementById('phoneError');
            
            // Remove any non-digit characters for validation
            const cleanedPhone = phoneNumber.replace(/\D/g, '');
            
            // Check if empty
            if (!phoneNumber || phoneNumber.trim() === '') {
                phoneError.textContent = 'Phone number is required';
                phoneError.style.display = 'block';
                return false;
            }
            
            // Check if contains only digits
            if (!/^[0-9]+$/.test(phoneNumber)) {
                phoneError.textContent = 'Phone number must contain only digits';
                phoneError.style.display = 'block';
                return false;
            }
            
            // Check length (minimum 6, maximum 15)
            if (cleanedPhone.length < 6) {
                phoneError.textContent = 'Phone number must be at least 6 digits';
                phoneError.style.display = 'block';
                return false;
            }
            
            if (cleanedPhone.length > 15) {
                phoneError.textContent = 'Phone number cannot exceed 15 digits';
                phoneError.style.display = 'block';
                return false;
            }
            
            // If all checks pass
            phoneError.style.display = 'none';
            return true;
        }
        
        // Real-time phone validation
        const phoneInput = document.getElementById('tel');
        phoneInput.addEventListener('input', function() {
            validatePhoneNumber(this.value);
        });
        
        phoneInput.addEventListener('blur', function() {
            validatePhoneNumber(this.value);
        });
        
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userType = document.getElementById('userType').value;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const countryCode = document.getElementById('countryCode').value;
            const phoneNumber = document.getElementById('tel').value;
            const tel = countryCode + phoneNumber;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validation
            if (!userType) {
                errorMessage.textContent = 'Please select an account type';
                errorMessage.classList.add('show');
                successMessage.classList.remove('show');
                return;
            }
            
            // Validate phone number
            if (!validatePhoneNumber(phoneNumber)) {
                errorMessage.textContent = 'Please enter a valid phone number';
                errorMessage.classList.add('show');
                successMessage.classList.remove('show');
                return;
            }
            
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.classList.add('show');
                successMessage.classList.remove('show');
                return;
            }
            
            if (password.length < 6) {
                errorMessage.textContent = 'Password must be at least 6 characters';
                errorMessage.classList.add('show');
                successMessage.classList.remove('show');
                return;
            }
            
            try {
                errorMessage.classList.remove('show');
                successMessage.classList.remove('show');
                
                // Send registration data to API
                const response = await fetch('http://localhost/backend/api/register.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        user_type: userType,
                        name: name,
                        email: email,
                        tel: tel,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    successMessage.textContent = 'Account created successfully! Redirecting to login...';
                    successMessage.classList.add('show');
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    errorMessage.textContent = data.message || 'Registration failed';
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                console.error('Registration error:', error);
                errorMessage.textContent = 'An error occurred. Please try again.';
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>
</html>
