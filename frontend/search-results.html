<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - SkyVoyage</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        .results-page {
            padding-top: 80px;
            min-height: 100vh;
            background: var(--color-gray-50);
        }
        
        .results-header {
            background: var(--color-white);
            padding: var(--spacing-xl) 0;
            border-bottom: 1px solid var(--color-gray-200);
        }
        
        .search-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }
        
        .results-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: var(--spacing-xl);
            padding: var(--spacing-xl) 0;
        }
        
        .filters-sidebar {
            background: var(--color-white);
            padding: var(--spacing-xl);
            border-radius: var(--radius-xl);
            height: fit-content;
            position: sticky;
            top: 100px;
        }
        
        .filter-group {
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-xl);
            border-bottom: 1px solid var(--color-gray-200);
        }
        
        .filter-group:last-child {
            border-bottom: none;
        }
        
        .filter-group h3 {
            font-size: var(--text-lg);
            margin-bottom: var(--spacing-md);
        }
        
        .flight-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }
        
        .flight-card {
            background: var(--color-white);
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
            transition: var(--transition-base);
        }
        
        .flight-card:hover {
            box-shadow: var(--shadow-xl);
            transform: translateY(-4px);
        }
        
        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .airline-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .airline-logo {
            width: 50px;
            height: 50px;
            border-radius: var(--radius-md);
            background: var(--color-gray-100);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .flight-details {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: var(--spacing-xl);
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .flight-time {
            display: flex;
            flex-direction: column;
        }
        
        .time {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--color-gray-900);
        }
        
        .airport {
            color: var(--color-gray-600);
            font-size: var(--text-sm);
        }
        
        .flight-duration {
            text-align: center;
            position: relative;
        }
        
        .duration-line {
            width: 100%;
            height: 2px;
            background: var(--color-gray-300);
            position: relative;
            margin: var(--spacing-sm) 0;
        }
        
        .duration-line::before {
            content: '';
            position: absolute;
            left: 0;
            top: -4px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-color);
        }
        
        .duration-line::after {
            content: '';
            position: absolute;
            right: 0;
            top: -4px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-color);
        }
        
        .flight-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-gray-200);
        }
        
        .price {
            font-size: var(--text-3xl);
            font-weight: 800;
            color: var(--primary-color);
        }
        
        .price-label {
            font-size: var(--text-sm);
            color: var(--color-gray-600);
        }
        
        .no-results {
            text-align: center;
            padding: var(--spacing-3xl);
            background: var(--color-white);
            border-radius: var(--radius-xl);
        }
        
        .loading {
            text-align: center;
            padding: var(--spacing-3xl);
        }
        
        @media (max-width: 768px) {
            .results-container {
                grid-template-columns: 1fr;
            }
            
            .filters-sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-plane-departure"></i>
                <span>SkyVoyage</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="#" class="active">Flights</a></li>
                <li><a href="#">My Bookings</a></li>
                <li><a href="#">Deals</a></li>
            </ul>
            <div class="nav-actions">
                <a href="login.html" class="btn btn-text btn-login">Login</a>
                <a href="register.html" class="btn btn-primary btn-signup">Sign Up</a>
            </div>
        </div>
    </nav>
    
    <div class="results-page">
        <div class="results-header">
            <div class="container">
                <div class="search-summary">
                    <div>
                        <h2 id="routeInfo">Loading...</h2>
                        <p id="searchDetails"></p>
                    </div>
                    <button class="btn btn-secondary" onclick="window.location.href='index.html'">
                        <i class="fas fa-edit"></i> Modify Search
                    </button>
                </div>
            </div>
        </div>
        
        <div class="container results-container">
            <aside class="filters-sidebar">
                <h2>Filters</h2>
                
                <div class="filter-group">
                    <h3>Price Range</h3>
                    <input type="range" id="priceRange" min="0" max="2000" step="50" value="2000">
                    <p>Up to $<span id="priceValue">2000</span></p>
                </div>
                
                <div class="filter-group">
                    <h3>Departure Time</h3>
                    <label><input type="checkbox" value="morning"> Morning (6AM - 12PM)</label><br>
                    <label><input type="checkbox" value="afternoon"> Afternoon (12PM - 6PM)</label><br>
                    <label><input type="checkbox" value="evening"> Evening (6PM - 12AM)</label><br>
                    <label><input type="checkbox" value="night"> Night (12AM - 6AM)</label>
                </div>
                
                <div class="filter-group">
                    <h3>Airlines</h3>
                    <div id="airlineFilters"></div>
                </div>
                
                <div class="filter-group">
                    <h3>Stops</h3>
                    <label><input type="checkbox" value="nonstop" checked> Non-stop</label><br>
                    <label><input type="checkbox" value="1stop"> 1 Stop</label><br>
                    <label><input type="checkbox" value="2stop"> 2+ Stops</label>
                </div>
                
                <button class="btn btn-primary" style="width: 100%;" onclick="applyFilters()">Apply Filters</button>
            </aside>
            
            <main>
                <div class="loading" id="loading">
                    <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--primary-color);"></i>
                    <p>Searching for flights...</p>
                </div>
                
                <div class="flight-list" id="flightList" style="display: none;"></div>
                
                <div class="no-results" id="noResults" style="display: none;">
                    <i class="fas fa-plane-slash fa-3x" style="color: var(--color-gray-400); margin-bottom: var(--spacing-lg);"></i>
                    <h2>No Flights Found</h2>
                    <p>Try adjusting your search criteria or filters</p>
                    <button class="btn btn-primary" onclick="window.location.href='index.html'" style="margin-top: var(--spacing-lg);">
                        New Search
                    </button>
                </div>
            </main>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        let allFlights = [];
        let filteredFlights = [];
        
        async function loadFlights() {
            const searchData = JSON.parse(sessionStorage.getItem('searchData'));
            
            if (!searchData) {
                window.location.href = 'index.html';
                return;
            }
            
            // Update search summary
            document.getElementById('routeInfo').textContent = 'Search Results';
            document.getElementById('searchDetails').textContent = 
                `${searchData.departure} • ${searchData.passengers} passenger(s) • ${searchData.class}`;
            
            try {
                const flights = await searchFlights(searchData);
                allFlights = flights;
                filteredFlights = flights;
                
                document.getElementById('loading').style.display = 'none';
                
                if (flights.length === 0) {
                    document.getElementById('noResults').style.display = 'block';
                } else {
                    displayFlights(flights);
                }
            } catch (error) {
                console.error('Error loading flights:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('noResults').style.display = 'block';
            }
        }
        
        function displayFlights(flights) {
            const flightList = document.getElementById('flightList');
            flightList.style.display = 'flex';
            flightList.innerHTML = '';
            
            flights.forEach(flight => {
                const card = createFlightCard(flight);
                flightList.appendChild(card);
            });
        }
        
        function createFlightCard(flight) {
            const card = document.createElement('div');
            card.className = 'flight-card';
            
            const departureTime = formatTime(flight.departure_time);
            const arrivalTime = formatTime(flight.arrival_time);
            const duration = calculateDuration(flight.departure_time, flight.arrival_time);
            const price = formatCurrency(flight.base_price);
            
            card.innerHTML = `
                <div class="flight-header">
                    <div class="airline-info">
                        <div class="airline-logo">${flight.airline_code || 'XX'}</div>
                        <div>
                            <h3>${flight.airline_name || 'Airline'}</h3>
                            <p style="font-size: var(--text-sm); color: var(--color-gray-600);">
                                ${flight.flight_number} • ${flight.aircraft_model || 'Aircraft'}
                            </p>
                        </div>
                    </div>
                    <span class="badge" style="background: var(--color-gray-100); padding: var(--spacing-sm) var(--spacing-md); border-radius: var(--radius-full); font-weight: 600;">
                        ${flight.available_seats} seats left
                    </span>
                </div>
                
                <div class="flight-details">
                    <div class="flight-time">
                        <span class="time">${departureTime}</span>
                        <span class="airport">${flight.origin_city} (${flight.origin_code})</span>
                        <span class="date">${formatDate(flight.departure_time)}</span>
                    </div>
                    
                    <div class="flight-duration">
                        <p style="font-size: var(--text-sm); color: var(--color-gray-600);">${duration}</p>
                        <div class="duration-line"></div>
                        <p style="font-size: var(--text-xs); color: var(--color-gray-500);">Non-stop</p>
                    </div>
                    
                    <div class="flight-time" style="text-align: right;">
                        <span class="time">${arrivalTime}</span>
                        <span class="airport">${flight.destination_city} (${flight.destination_code})</span>
                        <span class="date">${formatDate(flight.arrival_time)}</span>
                    </div>
                </div>
                
                <div class="flight-footer">
                    <div>
                        <div class="price">${price}</div>
                        <div class="price-label">per passenger</div>
                    </div>
                    <button class="btn btn-primary" onclick="selectFlight(${flight.flight_id})">
                        Select Flight <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            `;
            
            return card;
        }
        
        function selectFlight(flightId) {
            const flight = allFlights.find(f => f.flight_id === flightId);
            if (flight) {
                sessionStorage.setItem('selectedFlight', JSON.stringify(flight));
                window.location.href = 'booking.html';
            }
        }
        
        function applyFilters() {
            // Price filter
            const maxPrice = parseInt(document.getElementById('priceRange').value);
            
            filteredFlights = allFlights.filter(flight => 
                parseFloat(flight.base_price) <= maxPrice
            );
            
            displayFlights(filteredFlights);
        }
        
        // Price range slider
        const priceRange = document.getElementById('priceRange');
        const priceValue = document.getElementById('priceValue');
        
        if (priceRange) {
            priceRange.addEventListener('input', (e) => {
                priceValue.textContent = e.target.value;
            });
        }
        
        // Load flights on page load
        loadFlights();
        checkAuth();
    </script>
</body>
</html>
